name: example
description: Mehery PushApp SDK integration example.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  mehery_sender:
    path: ../
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
