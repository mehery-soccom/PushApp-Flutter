name: mehery_sender
description: >-
  Flutter SDK for Mehery PushApp — push notifications, event tracking,
  in-app messages (banner, popup, PiP), and Android native notification templates.
version: 0.1.15
homepage: https://github.com/mehery-soccom/PushApp-Flutter
repository: https://github.com/mehery-soccom/PushApp-Flutter
issue_tracker: https://github.com/mehery-soccom/PushApp-Flutter/issues
documentation: https://docs.mehery.com/guide/pushapp/flutter-sdk/

topics:
  - push-notifications
  - firebase
  - in-app-messaging
  - notifications
  - mehery

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0 # For HTTP requests
  app_set_id: ^1.2.0 # For app-specific identification (if used)
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1
  device_info_plus: ^11.4.0
  package_info_plus: ^8.3.0
  web_socket_channel: ^2.4.0
  flutter_html: ^3.0.0
  webview_flutter: ^4.13.0
  super_tooltip: ^2.1.1
  webview_flutter_wkwebview: ^3.22.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# Flutter specific settings
flutter:
  plugin:
    platforms:
      android:
        package: com.mehery.sender
        pluginClass: MeherySenderPlugin

  assets:
    - assets/layouts/

false_secrets:
  - example/ios/Runner/GoogleService-Info.plist
  - example/android/app/google-services.json
  - example/lib/firebase_options.dart
